# Full stack:   docker compose up --build        -> http://localhost:8080
# Server tests: docker compose run --rm server-test
# Client tests: docker compose run --rm client-test
name: mydiary

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mydiary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydiary}
      POSTGRES_DB: ${POSTGRES_DB:-mydiary}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 5433 on the host so it does not clash with a local Postgres on 5432
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
      target: production
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-mydiary}:${POSTGRES_PASSWORD:-mydiary}@db:5432/${POSTGRES_DB:-mydiary}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me}
      CLIENT_URL: http://localhost:${CLIENT_PORT:-8080}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-3000}:3000"

  client:
    build:
      context: ./client
      target: production
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-8080}:80"

  server-test:
    profiles: ["test"]
    build:
      context: ./server
      target: test
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-mydiary}:${POSTGRES_PASSWORD:-mydiary}@db:5432/mydiary_test
      SECRET_KEY: test-secret
    depends_on:
      db:
        condition: service_healthy

  client-test:
    profiles: ["test"]
    build:
      context: ./client
      target: test

volumes:
  db-data:
